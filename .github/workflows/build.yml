name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk Daysheet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Daysheet-apk
          path: Daysheet.apk
      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Daysheet.apk --title "Daysheet (latest build)" --notes "Built from ${GITHUB_SHA::7}"
      - name: Keep a copy on the apk branch
        run: |
          mkdir out && cp Daysheet.apk out/ && cd out
          git init -q -b apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add Daysheet.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
