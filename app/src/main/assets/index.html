<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Daysheet</title>
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/plex-sans-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/plex-sans-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/plex-sans-600.woff2) format("woff2");font-weight:600 800;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/plex-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/plex-mono-500.woff2) format("woff2");font-weight:500 700;font-display:swap}
/* One screen: date, four big buttons, evening catch-up, a one-line total. */
:root{
  --paper:#F3F6F9; --sheet:#FFFFFF; --ink:#15202B; --muted:#5A6877; --line:#D3DCE5; --grid:#E8EDF2;
  --accent:#1E4C8A; --accent-ink:#FFFFFF; --ok:#2E7A4F;
  --a0:#3557A6; --a1:#1A7F71; --a2:#4C6073; --a3:#AE4068;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0D131A; --sheet:#141C25; --ink:#E3E9EF; --muted:#8C99A7; --line:#283442; --grid:#1B2530;
  --accent:#86ADE3; --accent-ink:#0D131A; --ok:#6CC08F;
  --a0:#7F9DE0; --a1:#4FC2AF; --a2:#94A8BB; --a3:#E27FA3; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1.5px solid var(--ink)}
header b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:18px;letter-spacing:.06em}
header span{font-size:14px;color:var(--muted)}

.status{font-size:15px;color:var(--muted);min-height:22px}
.status strong{color:var(--ink);font-weight:600}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ab{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;
  min-height:128px;padding:14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--sheet)}
.ab::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.ab b{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.ab .t{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--sheet))}
.ab.on .t{color:var(--ink);font-size:16px;font-weight:500}
.ab.on::after{content:"Tap to stop";position:absolute;top:12px;right:12px;font-size:11px;color:var(--muted)}
.ab:active{transform:scale(.985)}

.card{border:1.5px solid var(--accent);border-radius:var(--r);background:var(--sheet);padding:14px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--f-display);font-stretch:110%;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.card p{margin:0}
.gapt{font-size:20px;font-weight:500}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--sheet));font-weight:500;text-align:left}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.skip{justify-self:start;border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 0}
.done{color:var(--ok);font-weight:500}

footer{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer .mono{color:var(--ink)}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}

#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(5,10,15,.45)}
.panel{position:relative;background:var(--sheet);border-radius:16px 16px 0 0;max-height:90%;overflow:auto;border-top:1.5px solid var(--ink)}
.panel .wrap{gap:14px}
.panel h3{margin:0;font-family:var(--f-display);font-stretch:110%;font-size:18px}
.panel h4{margin:6px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld{display:flex;align-items:center;gap:10px}
.fld i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
input[type=text],input[type=time],textarea{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:120px;font-family:var(--f-mono);font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0}
label.tog{display:flex;gap:8px;align-items:center}
label.tog input{width:20px;height:20px;accent-color:var(--accent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
#toast button{border:0;background:none;color:var(--paper);font-weight:700;text-decoration:underline;padding:0}
</style>
</head><body>
<div class="wrap" id="app"></div>
<div id="sheet" hidden><div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true"><div class="wrap" id="panel"></div></div></div>
<div id="toast" role="status" hidden></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const minOf = d => d.getHours()*60 + d.getMinutes();
const hm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const dur = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const nid = () => Math.random().toString(36).slice(2, 10);
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EVENING = 18 * 60;

/* ---------- storage (on this phone) ---------- */
const P = 'v2:';
const get = (k, dflt) => { try { const v = localStorage.getItem(P + k); return v ? JSON.parse(v) : dflt; } catch { return dflt; } };
const put = (k, v) => { try { v === undefined ? localStorage.removeItem(P + k) : localStorage.setItem(P + k, JSON.stringify(v)); } catch { toast('Could not save. Phone storage may be full.'); } };
const DEFAULTS = { areas:[{ id:'a0', name:'Design' }, { id:'a1', name:'Site & clients' }, { id:'a2', name:'Admin' }, { id:'a3', name:'Personal' }], reminder:{ on:true, h:21, m:0 } };
const settings = () => { const s = get('settings', null); return s || structuredClone(DEFAULTS); };
const areas = () => settings().areas;
const areaName = id => areas().find(a => a.id === id)?.name || 'Other';
const col = id => `var(--${/^a[0-3]$/.test(id) ? id : 'a2'})`;
const day = date => get('d-' + date, { log:[], skip:[] });
const updDay = (date, fn) => { const d = day(date); d.log ||= []; d.skip ||= []; fn(d); put('d-' + date, d); };
const timer = () => get('timer', null);

/* ---------- time maths ---------- */
function gaps(intervals, from, to, min){
  const iv = intervals.map(x => [x.s, x.e]).sort((a,b) => a[0]-b[0]), out = [];
  let cur = from;
  for (const [s, e] of iv) { if (e <= cur) continue; if (s > cur && Math.min(s, to) - cur >= min) out.push([cur, Math.min(s, to)]); cur = Math.max(cur, e); if (cur >= to) break; }
  if (to - cur >= min) out.push([cur, to]);
  return out.flatMap(([s, e]) => { const r = []; let c = s; while (e - c > 150) { const n = Math.min(e, (Math.floor(c/60) + 2)*60); r.push([c, n]); c = n; } r.push([c, e]); return r; });
}
function logRange(start, end, area){
  // Split across midnight so each day gets its own part.
  let cur = new Date(start); const stop = new Date(end); let total = 0;
  while (cur < stop) {
    const date = ymd(cur), s = minOf(cur);
    const next = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
    const e = next <= stop ? 1440 : minOf(stop);
    if (e - s >= 1) { updDay(date, d => d.log.push({ id:nid(), s, e, area })); total += e - s; }
    cur = next;
  }
  return total;
}
const totals = date => { const t = {}; for (const l of day(date).log) t[l.area] = (t[l.area] || 0) + (l.e - l.s); return t; };
window.__daysheet = { gaps };

/* ---------- toast with undo ---------- */
let tt = 0;
function toast(msg, undo){
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undo">Undo</button>' : ''}`; t.hidden = false;
  if (undo) $('#undo').onclick = () => { undo(); t.hidden = true; render(); };
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, undo ? 5000 : 3000);
}
const snapshot = keys => { const saved = keys.map(k => [k, get(k, undefined)]); return () => saved.forEach(([k, v]) => put(k, v)); };

/* ---------- render ---------- */
function render(){
  const t = today(), now = new Date(), nm = minOf(now), r = timer(), tot = totals(t);
  if (r && r.area) { const start = new Date(r.start); if (ymd(start) === t) tot[r.area] = (tot[r.area] || 0) + Math.max(0, (now - start)/60000); }
  const d = parse(t), list = areas();
  const status = r ? `<strong>${esc(areaName(r.area))}</strong> since ${hm(minOf(new Date(r.start)))}` : 'Tap what you are working on.';
  const grid = list.map(a => {
    const on = r && r.area === a.id;
    return `<button class="ab ${on ? 'on' : ''}" style="--c:${col(a.id)}" data-act="tap" data-id="${a.id}"><b>${esc(a.name)}</b><span class="t" ${on ? 'id="elapsed"' : ''}>${on ? '' : (tot[a.id] ? dur(tot[a.id]) + ' today' : '—')}</span></button>`;
  }).join('');

  // Evening catch-up
  let catchup = '';
  const dt = day(t);
  if (nm >= EVENING) {
    const firstS = Math.min(9*60, ...dt.log.map(l => l.s));
    let to = nm; if (r && ymd(new Date(r.start)) === t) to = Math.min(to, minOf(new Date(r.start)));
    const gs = to > firstS ? gaps(dt.log.concat(dt.skip), firstS, to, 20) : [];
    if (gs.length) {
      const [s, e] = gs[0];
      catchup = `<section class="card"><h2>Evening catch-up <small>${gs.length} left</small></h2>
        <p class="gapt mono">${hm(s)}–${hm(e)} <span class="hint" style="font-family:var(--f-body)">· ${dur(e - s)}</span></p>
        <p class="hint">What was this mostly?</p>
        <div class="chips">${list.map(a => `<button class="chip" style="--c:${col(a.id)}" data-act="fill" data-id="${a.id}" data-s="${s}" data-e="${e}">${esc(a.name)}</button>`).join('')}</div>
        <button class="skip" data-act="skip" data-s="${s}" data-e="${e}">Skip this one</button></section>`;
    } else if (dt.log.length) catchup = `<p class="done">✓ Today is fully logged.</p>`;
  }

  // Week total (Mon–Sun)
  const ws = addDays(t, -((d.getDay() + 6) % 7));
  let week = 0; for (let i = 0; i < 7; i++) { const x = addDays(ws, i); if (x > t) break; for (const l of day(x).log) week += l.e - l.s; }
  const todayTot = Object.values(tot).reduce((a, b) => a + b, 0);

  $('#app').innerHTML = `<header><b>DAYSHEET</b><span>${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}</span></header>
    <p class="status">${status}</p>
    <div class="grid">${grid}</div>
    ${catchup}
    <footer><span>Today <span class="mono">${dur(todayTot)}</span> · Week <span class="mono">${dur(week)}</span></span><button class="link" data-act="edit">Edit</button></footer>`;
  tickTimer();
}
let tick = 0;
function tickTimer(){
  clearInterval(tick); const r = timer(); if (!r) return;
  const up = () => { const s = Math.max(0, Math.floor((Date.now() - r.start)/1000)), el = $('#elapsed'); if (el) el.textContent = `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; };
  up(); tick = setInterval(up, 1000);
}

/* ---------- edit sheet ---------- */
function openEdit(){
  const s = settings();
  $('#panel').innerHTML = `<h3>Edit</h3>
    <h4>Buttons</h4>
    ${s.areas.map(a => `<div class="fld" style="--c:${col(a.id)}"><i></i><input type="text" id="n-${a.id}" value="${esc(a.name)}" maxlength="24" aria-label="Button name"></div>`).join('')}
    <h4>Evening reminder</h4>
    <div class="row"><label class="tog"><input type="checkbox" id="r-on" ${s.reminder.on ? 'checked' : ''}> Remind me at</label><input type="time" id="r-t" value="${pad(s.reminder.h)}:${pad(s.reminder.m)}" style="flex:0 1 140px"></div>
    <div class="row"><button class="btn" data-act="save">Save</button><button class="btn ghost" data-act="close">Cancel</button></div>
    <h4>Backup</h4>
    <p class="hint">Everything lives on this phone only. Send yourself a backup now and then.</p>
    <div class="row"><button class="btn ghost" data-act="backup">Share backup</button><button class="btn ghost" data-act="restore">Restore</button></div>`;
  $('#sheet').hidden = false;
}
const closeSheet = () => { $('#sheet').hidden = true; $('#panel').innerHTML = ''; };
function applyReminder(){
  const r = settings().reminder;
  try { if (window.Android && Android.setReminder) Android.setReminder(r.h, r.m, !!r.on); } catch {}
}
function backupText(){
  const docs = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(P)) docs[k.slice(P.length)] = JSON.parse(localStorage.getItem(k)); } } catch {}
  return JSON.stringify({ app:'Daysheet', v:2, exported:new Date().toISOString(), docs });
}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'tap') {
    const r = timer(), undo = snapshot(['timer', 'd-' + today(), 'd-' + addDays(today(), -1)]);
    if (r) { const m = logRange(r.start, Date.now(), r.area); put('timer', undefined);
      if (r.area === id) { toast(m >= 1 ? `Logged ${dur(m)} to ${areaName(r.area)}` : 'Stopped', undo); return render(); } }
    put('timer', { area:id, start:Date.now() });
    if (r) toast(`Switched to ${areaName(id)}`, undo);
    return render();
  }
  if (a === 'fill') { const undo = snapshot(['d-' + today()]); const s = +t.dataset.s, en = +t.dataset.e;
    updDay(today(), d => d.log.push({ id:nid(), s, e:en, area:id })); toast(`${dur(en - s)} → ${areaName(id)}`, undo); return render(); }
  if (a === 'skip') { const undo = snapshot(['d-' + today()]); updDay(today(), d => d.skip.push({ s:+t.dataset.s, e:+t.dataset.e })); toast('Skipped', undo); return render(); }
  if (a === 'edit') return openEdit();
  if (a === 'close') return closeSheet();
  if (a === 'save') {
    const s = settings();
    s.areas.forEach(x => { const v = $('#n-' + x.id).value.trim(); if (v) x.name = v; });
    const [h, m] = ($('#r-t').value || '21:00').split(':').map(Number);
    s.reminder = { on:$('#r-on').checked, h, m };
    put('settings', s); applyReminder(); closeSheet(); render(); toast('Saved'); return;
  }
  if (a === 'backup') {
    const body = backupText();
    if (window.Android && Android.share) { Android.share(body, `Daysheet backup ${today()}`); return; }
    $('#panel').innerHTML = `<h3>Backup</h3><p class="hint">Copy this text and keep it somewhere safe.</p><textarea readonly id="bk">${esc(body)}</textarea><div class="row"><button class="btn ghost" data-act="close">Close</button></div>`; return;
  }
  if (a === 'restore') {
    $('#panel').innerHTML = `<h3>Restore</h3><p class="hint">Paste a backup. This replaces what is on this phone.</p><textarea id="imp" placeholder='{"app":"Daysheet", ...}'></textarea><div class="row"><button class="btn" data-act="restore-go">Replace my data</button><button class="btn ghost" data-act="close">Cancel</button></div>`; return;
  }
  if (a === 'restore-go') {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to replace'; return; }
    let data; try { data = JSON.parse($('#imp').value); } catch {}
    if (!data || data.app !== 'Daysheet' || data.v !== 2 || typeof data.docs !== 'object') return toast('That is not a Daysheet backup.');
    try { Object.keys(localStorage).filter(k => k.startsWith(P)).forEach(k => localStorage.removeItem(k)); } catch {}
    Object.entries(data.docs).forEach(([k, v]) => put(k, v));
    applyReminder(); closeSheet(); render(); toast('Restored'); return;
  }
});

window.__back = () => { if (!$('#sheet').hidden) { closeSheet(); return true; } return false; };
window.__resume = () => render();
setInterval(() => { if ($('#sheet').hidden) render(); }, 60000);
if (!get('settings', null)) put('settings', structuredClone(DEFAULTS));
applyReminder();
render();
})();
</script>
</body></html>
