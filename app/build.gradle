plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aarhi.daysheet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aarhi.daysheet'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file('daysheet.keystore')
            storePassword 'daysheet-aarhi'
            keyAlias 'daysheet'
            keyPassword 'daysheet-aarhi'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
