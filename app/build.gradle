plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aarhi.register'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aarhi.register'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('register.keystore')
            storePassword 'aarhi-register'
            keyAlias 'register'
            keyPassword 'aarhi-register'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
